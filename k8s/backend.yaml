apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ticket-uploads
  namespace: supporthub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: supporthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$DB_USER" -d "$DB_NAME"; do sleep 2; done
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: supporthub-config
                  key: DB_NAME
      containers:
        - name: backend
          image: ai-support-backend:password-reset-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: supporthub-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: supporthub-mail
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: supporthub-mail
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: supporthub-mail
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supporthub-mail
                  key: SMTP_PASSWORD
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: supporthub-mail
                  key: MAIL_FROM
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: ticket-uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
      volumes:
        - name: ticket-uploads
          persistentVolumeClaim:
            claimName: ticket-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: supporthub
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
