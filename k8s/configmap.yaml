apiVersion: v1
kind: ConfigMap
metadata:
  name: supporthub-config
  namespace: supporthub
data:
  POSTGRES_DB: customer_support_db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: customer_support_db
  PORT: "5000"
  NODE_ENV: production
  JWT_EXPIRES_IN: 1d
  UPLOAD_DIR: /app/uploads
  OPENAI_MODEL: gpt-4o-mini
  FRONTEND_URL: http://localhost:8082
  SMTP_SECURE: "false"
  CORS_ORIGIN: http://localhost:30080,http://localhost:8080,http://localhost:8081,http://localhost:8082
