apiVersion: batch/v1
kind: Job
metadata:
  name: supporthub-admin-seed
  namespace: supporthub
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$DB_USER" -d "$DB_NAME"; do sleep 2; done
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: supporthub-config
                  key: DB_NAME
      containers:
        - name: create-administrator
          image: ai-support-backend:local
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/seedAdmin.js"]
          envFrom:
            - configMapRef:
                name: supporthub-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supporthub-secrets
                  key: DB_PASSWORD
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: supporthub-admin
                  key: ADMIN_NAME
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: supporthub-admin
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supporthub-admin
                  key: ADMIN_PASSWORD
